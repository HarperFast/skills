  # ===========================================================================
  # API & Communication (priority 2 — HIGH)
  # ===========================================================================

  - rule: automatic-apis
    description: How to use Harper's automatically generated REST and WebSocket APIs.
    category: api
    priority: 2
    order: 1
    mode: generate
    sources:
      # overview.md is sourced section-by-section rather than whole-file: at
      # ~15KB it was the largest single input in the skill, and the compression
      # dropped conditional requests, content negotiation, and the `GET`
      # caveats outright. Listing sections narrows the input and makes a docs
      # rename fail loudly in sliceSection. The dropped headings are the
      # `# REST Overview` preamble (marketing + a version badge) and
      # `## See Also` (link list); `## OpenAPI` is kept because the rule
      # documents `GET /openapi`.
      - path: reference/v5/rest/overview.md
        section: 'How the REST Interface Works'
        role: primary
      - path: reference/v5/rest/overview.md
        section: 'Configuration'
        role: primary
      - path: reference/v5/rest/overview.md
        section: 'Tables and Their Automatic Endpoints'
        role: primary
      - path: reference/v5/rest/overview.md
        section: 'URL Structure'
        role: primary
      - path: reference/v5/rest/overview.md
        section: 'HTTP Methods'
        role: primary
      - path: reference/v5/rest/overview.md
        section: 'Content Types'
        role: primary
      - path: reference/v5/rest/overview.md
        section: 'OpenAPI'
        role: supplemental
      - path: reference/v5/rest/websockets.md
        role: supplemental
    must_cover:
      - 'rest: true'
      - '@export'
      - 'WebSocket'
      # Each of the following occurs exactly once across the sourced sections,
      # so each pins one previously-dropped section:
      #   If-None-Match / 304 Not Modified → `#### Conditional Requests and Caching`
      #   `Accept`                         → `## Content Types` (bare `Accept`
      #     would be satisfied by the SSE `Accept: text/event-stream` mention
      #     under `## Tables and Their Automatic Endpoints`, which gates nothing)
      #   .msgpack                         → the reserved content-type selector
      #     suffixes and the undeclared-property caveat in `### GET`
      - 'If-None-Match'
      - '304 Not Modified'
      - 'ETag'
      - '`Accept`'
      - '.msgpack'
      # Pinned after the first regen dropped them while restoring the three
      # sections above — an unanchored fact is only ever one regen from being
      # compressed away, whichever fact it is:
      #   Location (2×)     → the primary key POST returns in that header
      #   @updatedTime (1×) → the three exceptions PUT always applies
      - 'Location'
      - '@updatedTime'
    cross_links:
      - querying-rest-apis
      - real-time-apps

  - rule: querying-rest-apis
    description: How to use query parameters to filter, sort, and paginate Harper REST APIs.
    category: api
    priority: 2
    order: 2
    mode: generate
    sources:
      - path: reference/v5/rest/querying.md
        role: primary
    must_cover:
      - '=gt='
      - '=lt='
      - 'select('
      - 'sort('
      - 'limit('
    cross_links:
      - automatic-apis

  - rule: real-time-apps
    description: How to build real-time features in Harper using WebSockets and Pub/Sub.
    category: api
    priority: 2
    order: 3
    mode: generate
    sources:
      - path: reference/v5/rest/websockets.md
        role: primary
    must_cover:
      - 'WebSocket'
      - 'connect('
    cross_links:
      - automatic-apis

  - rule: checking-authentication
    description: How to handle user authentication and sessions in Harper Resources.
    category: api
    priority: 2
    order: 4
    mode: generate
    sources:
      - path: reference/v5/resources/resource-api.md
        section: '`getCurrentUser(): User | undefined`'
        role: primary
      - path: reference/v5/resources/resource-api.md
        section: 'Session and Login from a Resource'
        role: primary
      # JWT half. Sectioned *and* anchored deliberately.
      #
      # The generator concatenates every resolved source into one unlabeled
      # blob (lib/sources.mjs `resolveSources`) and the system prompt tells the
      # model to "keep it tight" and omit tangential detail. So whatever no
      # `must_cover` anchor requires is exactly what gets compressed away —
      # anchor starvation, not source ordering or size. As a whole-file source
      # with no JWT anchors, this half collapsed to a single "use JWT instead"
      # pointer and lost the token issue/refresh flow entirely.
      #
      # `must_cover` is the actual gate: it is enforced verbatim
      # (validate-generated.mjs, `body.includes(must)`) and is echoed to the
      # model as a hard requirement. `section:` only narrows what gets fed in —
      # it helps because it tends to come with anchors, not on its own. Prefer
      # identifier-shaped anchors that occur in exactly one sourced section; an
      # anchor matching many sections gates nothing in particular.
      #
      # `role:` is a human-facing annotation only — the generator never reads
      # it (it is enum-checked by the validator and otherwise unused).
      - path: reference/v5/security/jwt-authentication.md
        section: 'Create Authentication Tokens'
        role: primary
      - path: reference/v5/security/jwt-authentication.md
        section: 'Using the Operation Token'
        role: supplemental
      - path: reference/v5/security/jwt-authentication.md
        section: 'Refreshing the Operation Token'
        role: primary
      - path: reference/v5/security/jwt-authentication.md
        section: 'Scoped Tokens (Inline Role)'
        role: primary
      - path: reference/v5/security/jwt-authentication.md
        section: 'Issuing Tokens from a Custom Resource'
        role: primary
      - path: reference/v5/security/jwt-authentication.md
        section: 'Token Expiry Configuration'
        role: supplemental
      # Sourced so the rule carries the *negative* recommendation too. Without
      # it the generated body pushed JWT at every non-browser client, while the
      # source actually points simple and server-to-server callers at Basic
      # Authentication — i.e. the rule was inviting token lifecycle complexity
      # the docs tell you to avoid.
      - path: reference/v5/security/jwt-authentication.md
        section: 'When to Use JWT Auth'
        role: primary
      - path: reference/v5/security/jwt-authentication.md
        section: 'Security Notes'
        role: supplemental
    must_cover:
      # Session half.
      - 'getCurrentUser()'
      - 'getContext()'
      - 'context.login'
      - 'enableSessions'
      # JWT half. One anchor per sourced section wherever an identifier is
      # unique to it: `server.operation` pins the custom-resource section,
      # `add_role`/`expires_in` the scoped-token section, `HTTPS` the security
      # notes (`operationTokenTimeout` alone no longer distinguishes those two,
      # since it occurs in both). `create_authentication_tokens` is the one
      # unavoidably broad anchor — it is the subject of its own section but is
      # back-referenced by three others, so it gates presence, not depth.
      - 'create_authentication_tokens'
      - 'refresh_operation_token'
      - 'server.operation'
      - 'add_role'
      - 'expires_in'
      - 'operationTokenTimeout'
      - 'HTTPS'
      # Scoped tokens are rejected with a 401 by nodes too old to understand
      # them. Unanchored, that bullet was dropped the first time this rule was
      # regenerated after the section was added — a rollout hazard, so it gets
      # its own anchor rather than relying on the section being sourced.
      - 'mixed-version'
      # Operation names alone gate vocabulary, not mechanics: a regeneration
      # could keep `create_authentication_tokens`/`refresh_operation_token` and
      # still drop the token exchange, the refresh timeout, or what the third
      # `server.operation` argument does. The anchors below pin those specific
      # semantics. Each occurs exactly once in the doc and in exactly one
      # sourced section, so it forces depth in that section rather than a
      # passing mention anywhere.
      #
      # Two caveats this list is deliberately built around:
      #
      # 1. `must_cover` is a substring test (`body.includes(must)`), so an
      #    anchor contained in another anchor gates nothing extra.
      #    `operation_token` is already implied by `refresh_operation_token`,
      #    and `refresh_token` by `Bearer <refresh_token>` — listing either
      #    separately would be noise, not coverage.
      # 2. A bare-fragment anchor invites literal satisfaction. Anchoring the
      #    exchange as `Bearer <refresh_token>` — rather than `refresh_token`,
      #    which occurs in three sourced sections — requires the body to show
      #    the refresh token actually being presented as the Bearer credential.
      #
      # `third argument` + `current authenticated user` pin the authorize
      # behavior together. `authorize: true` is the doc's prose name for it but
      # is rejected as an anchor: the code passes `true` positionally, so
      # forcing that string risks a body an agent transcribes as an options
      # object.
      - 'Bearer <refresh_token>'
      - 'refreshTokenTimeout'
      - 'third argument'
      - 'current authenticated user'
      # When to Use JWT Auth. `Basic Authentication` is a superstring of the
      # plain `Basic Auth` the section also contains — which is the better
      # anchor, since `Basic Auth` additionally appears in a code comment in
      # the custom-resource section and could be satisfied from there while the
      # recommendation itself stayed compressed away. `server-to-server` pins
      # the scenario the source actually steers away from JWT.
      #
      # `preferred over Basic Auth` carries the source's *conditional* framing.
      # It is anchored because sourcing the section alone was not enough: the
      # body kept a flat "for non-browser clients, use JWT" directive and filed
      # the Basic Auth alternative under Notes, which reads as a contradiction.
      # Anchoring the conditional forces the choice to be stated as a tradeoff.
      - 'Basic Authentication'
      - 'server-to-server'
      - 'preferred over Basic Auth'
    cross_links:
      - custom-resources

