  # ===========================================================================
  # Infrastructure & Ops (priority 4 — MEDIUM)
  # ===========================================================================

  - rule: deploying-to-harper-fabric
    description: How to deploy a Harper application to the Harper Fabric cloud.
    category: ops
    priority: 4
    order: 1
    mode: generate
    sources:
      - path: reference/v5/components/applications.md
        section: 'Remote Management'
        role: primary
      - path: fabric/cluster-creation-management.md
        section: 'Connecting the Harper CLI to a Cluster'
        role: supplemental
    must_cover:
      - 'harper deploy'
      - 'harper login'
      # `### Provisioning a Deploy Credential` is already inside the sourced
      # `## Remote Management` slice, and its security guidance was compressed
      # away anyway. These anchors pin it; each occurs only in that slice:
      #   fine-grained (2×) → prefer a fine-grained PAT over the `gh` CLI token
      #   read:org (1×)     → the account-wide scopes the `gh` token carries
      #   enc:v1: (1×)      → the client-side-encryption envelope
      # They double as the rename detector for that subheading: if it is
      # retitled or removed, the content goes and these anchors fail.
      - 'fine-grained'
      - 'Contents: Read-only'
      - 'read:org'
      - 'enc:v1:'
      # Pinned after the first regen dropped it while restoring the credential
      # guidance: `refs/heads/*` and `refs/tags/*` (or a bare branch/tag) are
      # the only refs a `by_ref` deploy can fetch.
      - 'refs/tags'
      # Also pinned after a regen dropped it: `setup=true` calls
      # `get_secrets_public_key` / `set_secret` / `grant_secret`, so it must be
      # run with an administrative credential, not the CI identity it
      # provisions for. The source escapes it as `super\_user`; every generated
      # body so far unescapes, so the anchor is the unescaped form.
      - 'super_user'
    cross_links:
      - creating-a-fabric-account-and-cluster

