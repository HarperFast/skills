      - 'super.'
      - '@export'
      - 'statusCode'

  - rule: programmatic-table-requests
    description: How to interact with Harper tables programmatically using the `tables` object.
    category: logic
    priority: 3
    order: 3
    mode: generate
    sources:
      - path: reference/v5/database/api.md
        section: '`tables`'
        role: primary
      - path: reference/v5/resources/resource-api.md
        section: 'Query Object'
        role: primary
      - path: reference/v5/database/api.md
        section: '`transaction(context?, callback)`'
        role: supplemental
      - path: reference/v5/resources/resource-api.md
        section: '`update(target: RequestTarget | Id, updates?: object): Promise<Resource>`'
        role: supplemental
      - path: reference/v5/resources/resource-api.md
        section: '`addTo(property: string, value: number)`'
        role: supplemental
      - path: reference/v5/components/javascript-environment.md
        section: 'Module Loading'
        role: supplemental
    must_cover:
      - 'tables'
      - 'conditions'
      - 'search('
      - 'addTo'
      - 'select'
      # Query Object options that were covered before the transaction material
      # was pinned, and that the regen then compressed out to make room. They
      # are anchored now rather than left to survive on luck; each occurs only
      # in § Query Object. `sort` also carries the `@indexed`-or-`conditions`
      # requirement and `allowFullScan`, which have no meaning without it.
      - 'sort'
      - '@indexed'
      - 'explain'
      - 'enforceExecutionOrder'
      # The `transaction(context?, callback)` source was already declared with a
      # `section:` and was still dropped in full — proof that sectioning narrows
      # the input but does not hold content in. Only an anchor does. Each of
      # these occurs in exactly one sourced section:
      #   transaction() (2×)     → § `transaction(context?, callback)`
      #   resetReadSnapshot() (1×) → its `### Transaction Object` member table
      #   atomicity (1×)         → `### Transaction Scope and Atomicity`
      #   limit / offset (1× each) → § Query Object, the pagination pair
      # Balanced parens deliberately: anchoring the bare `transaction(` also
      # gates the section, but the model satisfies it literally and writes
      # prose like "wrap background work in `transaction(`". `transaction()`
      # contains `transaction(`, so it is the stricter anchor as well.
      - 'transaction()'
      - 'resetReadSnapshot()'
      - 'atomicity'
      - 'limit'
      - 'offset'
      # § Module Loading's one piece of actionable build guidance: keep `harper`
      # external when bundling for SSR, or it is bundled instead of resolving
      # to the runtime. Only occurrence of `vite.config` in the sources.
      - 'vite.config'

