name: Generate Rules from Docs

# Regenerates docs-driven skill rules and opens a sync PR. Triggered when the
# documentation repo deploys (repository_dispatch), on a weekly safety-net
# cron, or manually. See docs/plans-archive/docs-driven-skills.md (Phase 2).
#
# Offline-first: the docs repo is checked out and built in-job; the generator
# reads the local build output and never fetches docs over the network.

on:
  repository_dispatch:
    types: [docs-updated]
  schedule:
    # Mondays 09:17 UTC — safety net in case a dispatch is missed.
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      docs_ref:
        description: 'Docs ref to build (branch, tag, or commit SHA)'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: generate-rules
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and open sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SKILLS_SYNC_APP_ID }}
          private-key: ${{ secrets.SKILLS_SYNC_APP_PRIVATE_KEY }}

      - name: Checkout skills
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: skills
          fetch-depth: 0
          # Use the App token so the branch push (and thus the auto-PR) is
          # attributed to the App and triggers the validate workflow.
          token: ${{ steps.app-token.outputs.token }}

      - name: Resolve docs ref
        id: docsref
        run: |
          REF="${{ github.event.client_payload.sha || github.event.inputs.docs_ref || 'main' }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Docs ref: $REF"

      - name: Checkout documentation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: HarperFast/documentation
          ref: ${{ steps.docsref.outputs.ref }}
          path: documentation
          # documentation is a public repo, so the default job token reads it.
          # Full history (fetch-depth: 0) so the sync PR body can resolve the
          # docs commit range since each rule's recorded baseline.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: skills/.nvmrc

      - name: Build documentation (produces flat-markdown under build/)
        working-directory: documentation
        run: |
          npm ci
          npm run build

      - name: Install skills dependencies
        working-directory: skills
        run: npm ci

      - name: Check out the rolling sync branch
        id: syncbranch
        working-directory: skills
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # Generate on top of the sync branch when an OPEN sync PR owns it,
        # rather than from main. Two reasons:
        #   1. Rules already regenerated at the current docs commit have a
        #      matching inputHash and are skipped, so an unrelated docs commit
        #      no longer re-samples every drifted rule. Re-sampling is what made
        #      facts appear and disappear between runs of the same PR.
        #   2. Fixes committed to the branch during review survive the next run
        #      instead of being force-pushed away.
        # The branch is still rolling: one open sync PR, updated in place.
        run: |
          set -euo pipefail
          BRANCH="auto/docs-sync"

          # Identity must be set before any merge below: actions/checkout does
          # not configure one, and a merge that is not a fast-forward writes a
          # commit. main advances routinely (semantic-release), so that is the
          # normal path, not an edge case. The commit step sets these again;
          # git config is idempotent.
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          # Reuse the branch only while an OPEN PR owns it. Branch existence is
          # not the same thing: closing a rejected sync PR leaves its head
          # branch behind, and building on that would carry abandoned generated
          # content into the next PR — or replay the conflict that caused the
          # rejection, defeating the "close the PR and re-run" recovery.
          #
          # `gh pr list` rather than `gh pr view`: list exits 0 with an empty
          # array when no PR matches, so "no PR" is distinguishable from a
          # transient or auth failure. `gh pr view` exits non-zero for both,
          # and treating a lookup failure as "no PR" would reset the branch to
          # main and discard an open PR's review fixes.
          if ! OPEN_PR=$(gh pr list --state open --head "$BRANCH" --json number --jq 'length'); then
            echo "::error::Could not determine whether an open sync PR owns $BRANCH. Refusing to touch the branch."
            exit 1
          fi

          if [ "$OPEN_PR" -gt 0 ]; then
            echo "Open sync PR owns $BRANCH — generating on top of it."
            git checkout -B "$BRANCH" "origin/$BRANCH"
            # Pick up anything that landed on main since the branch was cut.
            if ! git merge --no-edit origin/main; then
              # Capture the conflicted paths BEFORE aborting: --abort clears the
              # index, after which --diff-filter=U reports nothing.
              CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
              if [ -n "$CONFLICTS" ]; then
                git merge --abort || true
                echo "::error::$BRANCH conflicts with main in: ${CONFLICTS}. Resolve on the branch, or close the sync PR and re-run — the next run then starts clean from main."
              else
                git merge --abort || true
                echo "::error::git merge failed on $BRANCH without conflicts — see the log above."
              fi
              exit 1
            fi
            # Record that this run reused the branch, so the push step can
            # re-check ownership before overwriting it.
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            # No open PR: start clean from main. --force-with-lease on the push
            # still refuses to clobber anything pushed after this checkout.
            echo "No open sync PR owns $BRANCH — starting from main."
            git checkout -B "$BRANCH" origin/main
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture pre-sync provenance
        working-directory: skills
        # Snapshot each rule's recorded baseline (sourceCommit/inputHash) and
        # which rules are stale, BEFORE generation overwrites the frontmatter.
        # The PR step reads this snapshot to explain why each rule changed.
        # Non-strict: this never blocks the sync — the generator is the gate.
        run: npm run sync:report -- --docs-path ../documentation --out ../sync-provenance.json

      - name: Generate rules
        working-directory: skills
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # A rule whose regeneration keeps dropping facts is repaired, and if
        # that fails, held back: its committed body is kept and the run goes on
        # (see generate-rules.mjs). The report names held-back and repaired
        # rules for the PR body and the failure issue.
        run: npm run generate -- --docs-path ../documentation --report ../generation-report.json

      - name: Validate
        id: validate
        working-directory: skills
        # The log is quoted in the failure issue, so the reason is readable
        # there without opening the run.
        run: |
          set -o pipefail
          {
            npm run format:check
            npm run build
            node scripts/validate-skills.mjs
            node scripts/generation/validate-generated.mjs --docs-path ../documentation
          } 2>&1 | tee ../validate.log

      - name: Open or update sync PR
        working-directory: skills
        env:
          # The App token (not the default job token) ensures the auto-PR
          # triggers the validate workflow — PRs opened by the job token do
          # not trigger other workflows.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Every skill directory the generator writes to, from the SKILLS
          # registry in lib/manifest.mjs. Hardcoding one directory here meant a
          # skill added later (harper-mcp) was regenerated on every run and then
          # never staged, so it could not sync and an MCP-only docs change
          # reported "no changes".
          mapfile -t SKILL_DIRS < <(node scripts/generation/skill-dirs.mjs)

          HELD_BACK=$(jq '.heldBack | length' ../generation-report.json)

          # The generator writes rule bodies, AGENTS.md and SKILL.md under these.
          if git diff --quiet -- "${SKILL_DIRS[@]}"; then
            if [ "$HELD_BACK" -gt 0 ]; then
              # Nothing reached a PR, so nothing names the held-back rules:
              # fail, so the failure issue records them. Every sync retries
              # them until they regenerate faithfully or the manifest changes.
              echo "::error::Nothing to sync, but ${HELD_BACK} rule(s) were held back because regeneration kept dropping facts: $(jq -r '[.heldBack[].rule] | join(", ")' ../generation-report.json)."
              exit 1
            fi
            echo "No changes — skills are already in sync with docs."
            exit 0
          fi

          DOCS_SHA=$(git -C ../documentation rev-parse HEAD)
          SHORT=${DOCS_SHA:0:7}
          BRANCH="auto/docs-sync"

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

          # Re-check ownership before overwriting a branch this run reused. The
          # open-PR snapshot was taken before generation, which can take
          # minutes; if the PR was closed in that window, its content is
          # abandoned and pushing would resurrect it — possibly into a new PR.
          # Stop instead, and let the next run start clean from main.
          if [ "${{ steps.syncbranch.outputs.reused }}" = "true" ]; then
            if ! STILL_OPEN=$(gh pr list --state open --head "$BRANCH" --json number --jq 'length'); then
              echo "::error::Could not re-check the sync PR before pushing $BRANCH. Refusing to push."
              exit 1
            fi
            if [ "$STILL_OPEN" -eq 0 ]; then
              echo "::error::The sync PR for $BRANCH was closed during this run. Not pushing the reused branch — re-run to regenerate cleanly from main."
              exit 1
            fi
          fi

          # The branch is already checked out (see "Check out the rolling sync
          # branch"), so this commit lands on top of its existing history.
          git add -- "${SKILL_DIRS[@]}"
          git commit -m "docs: regenerate rules from documentation@${SHORT}"
          # This commit is a descendant of origin/$BRANCH (or of main on a fresh
          # branch), so the push normally fast-forwards. --force-with-lease
          # still covers the fresh-branch case while refusing to clobber a push
          # that landed after this job's checkout.
          git push --force-with-lease origin "$BRANCH"

          # Compose a provenance-rich body from the pre-sync snapshot: which
          # rules changed, the docs commit each was last synced from, and the
          # full docs commit range since the oldest such baseline.
          BODY="$(npm run --silent sync:report -- \
            --docs-path ../documentation \
            --format pr-body \
            --from ../sync-provenance.json \
            --generation-report ../generation-report.json)"

          STATE=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || echo "")
          if [ "$STATE" = "OPEN" ]; then
            echo "Existing sync PR updated."
            gh pr edit "$BRANCH" \
              --title "docs: regenerate rules from documentation@${SHORT}" \
              --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "docs: regenerate rules from documentation@${SHORT}" \
              --body "$BODY"
          fi

      # Last, so it reports a failure in any step above, including the PR step.
      - name: Report failure
        if: failure()
        working-directory: skills
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Resolve the actual docs commit SHA (falls back to the ref if the
          # documentation checkout failed before we could read HEAD).
          DOCS_SHA=$(git -C ../documentation rev-parse HEAD 2>/dev/null || echo "${{ steps.docsref.outputs.ref }}")

          # One open issue for every failure, whatever the docs SHA, so a
          # failure that repeats across docs deploys collects comments on one
          # issue instead of opening one per deploy.
          TITLE="Auto-sync generation failure"

          # What went wrong, quoted so the issue is readable without the run.
          DETAILS=../failure-details.md
          : > "$DETAILS"
          if [ -s ../generation-report.json ]; then
            npm run --silent sync:report -- --format held-back \
              --generation-report ../generation-report.json >> "$DETAILS" || true
          fi
          if [ "${{ steps.validate.outcome }}" = "failure" ] && [ -s ../validate.log ]; then
            {
              echo
              echo '<details><summary>Validation output (last 60 lines)</summary>'
              echo
              echo '```'
              tail -n 60 ../validate.log
              echo '```'
              echo
              echo '</details>'
            } >> "$DETAILS"
          fi

          # REST, not `gh issue list`: it pages through every open issue, where
          # the list command stops at 30 and could miss the one to reuse.
          # Issues only (the endpoint also returns PRs). A failed lookup falls
          # through to opening a new issue: a duplicate beats a silent failure.
          EXISTING=$(gh api --paginate "/repos/${{ github.repository }}/issues?state=open&per_page=100" \
            --jq ".[] | select(.pull_request == null and .title == \"${TITLE}\") | .number" \
            2>/dev/null | head -1 || true)

          if [ -n "$EXISTING" ]; then
            echo "Existing failure issue #${EXISTING} — appending comment."
            {
              echo "Failed again for docs \`${DOCS_SHA}\` at $(date -u +%Y-%m-%dT%H:%M:%SZ) — [workflow run](${RUN_URL})."
              echo
              cat "$DETAILS"
            } > ../failure-comment.md
            # REST, not `gh issue comment`: that uses the GraphQL addComment
            # mutation, which this App token cannot call ("Resource not
            # accessible by integration"), even though it can create issues
            # over REST. That failure used to abort this step under `set -e`,
            # so a repeat failure for an already-reported docs SHA produced no
            # comment AND no visible reason — the 2026-09-07 run left no trace
            # at all. Non-fatal either way: reporting must never mask the
            # generation failure it exists to report.
            gh api -X POST "/repos/${{ github.repository }}/issues/${EXISTING}/comments" \
              -F body=@../failure-comment.md \
              || echo "Could not append a comment to #${EXISTING} (non-fatal)."
          else
            {
              echo "Auto-sync failed for docs SHA \`${DOCS_SHA}\` — [workflow run](${RUN_URL})."
              echo
              echo "Opened automatically by \`.github/workflows/generate.yaml\`. Later failures are added to this issue as comments; close it once a sync succeeds."
              echo
              cat "$DETAILS"
              echo
              echo "**Common causes and fixes (Story 4 in docs/plans-archive/docs-driven-skills.md):**"
              echo "- Source file renamed or moved — update \`sources[].path\` in \`rules.manifest.yaml\`."
              echo "- Section heading renamed or removed — update \`sources[].section\`."
              echo "- Rules held back with nothing else to sync — regeneration kept dropping facts the committed"
              echo "  rule carries and the docs still state, even after repair passes. Pin the facts it loses"
              echo "  with \`must_cover\`, split the rule if its sources are more than the model reliably keeps,"
              echo "  or, if a removal is correct, record it under \`rules[<slug>].allow_dropped\`."
              echo
              echo "After fixing, regenerate locally (\`npm run generate -- --docs-path <docs>\`) and open a fix PR."
            } > ../failure-issue.md
            NEW_ISSUE_URL=$(gh issue create --title "${TITLE}" --body-file ../failure-issue.md)
            echo "Opened failure issue ${NEW_ISSUE_URL}"
            # Set the org-level "Bug" issue type (replaces the retired `bug` label).
            NEW_ISSUE_NUM=$(printf '%s' "$NEW_ISSUE_URL" | grep -oE '[0-9]+$')
            if [ -n "$NEW_ISSUE_NUM" ]; then
              gh api -X PATCH "/repos/${{ github.repository }}/issues/${NEW_ISSUE_NUM}" \
                -f type="Bug" || echo "Could not set issue type (non-fatal)."
            fi
          fi
